kind = "web"
previewPath = "/"
title = "CampusGPT"
version = "1.0.0"
id = "artifacts/campus-gpt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21086

[services.development]
run = "pnpm --filter @workspace/campus-gpt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-gpt", "run", "build" ]
publicDir = "artifacts/campus-gpt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21086"
BASE_PATH = "/"
