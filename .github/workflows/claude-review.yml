name: Claude PR review

# Requires the ANTHROPIC_API_KEY repository secret; skips cleanly without it. Skips forks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when ANTHROPIC_API_KEY is not configured
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY not set; skipping Claude review."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for correctness, security (secrets, auth,
            injection, unbounded Groq-backed endpoints), and consistency with the
            pnpm monorepo conventions. Be concise; comment only on real issues.
