name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: "3000"
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Generated API code is up to date
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react lib/api-zod \
            || (echo "::error::Generated API code is stale. Run 'pnpm --filter @workspace/api-spec run codegen' and commit." && exit 1)
      - name: Build
        run: pnpm -r --if-present run build
